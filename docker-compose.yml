services:
  edt:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:?Configure APP_ORIGIN en HTTPS}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      LEGAL_PUBLISHER: ${LEGAL_PUBLISHER:-}
      LEGAL_CONTACT: ${LEGAL_CONTACT:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      LEGAL_STATUS: ${LEGAL_STATUS:-}
      LEGAL_REGISTRATION: ${LEGAL_REGISTRATION:-}
      LEGAL_VAT: ${LEGAL_VAT:-}
      LEGAL_CAPITAL: ${LEGAL_CAPITAL:-}
      LEGAL_DIRECTOR: ${LEGAL_DIRECTOR:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-}
      SESSION_SECRET: ${SESSION_SECRET:?Configure SESSION_SECRET}
      CELCAT_XML_URL: ${CELCAT_XML_URL:-https://celcat-auth.univ-reims.fr/997/groupes/t1739184.xml}
      CELCAT_MAX_BYTES: ${CELCAT_MAX_BYTES:-}
    # Boucle locale uniquement : l’accès public passe par le proxy TLS (Traefik/Dokploy).
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Limites à ajuster après mesure en recette.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
