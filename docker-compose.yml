services:
  edt:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:?Configure APP_ORIGIN en HTTPS}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      LEGAL_PUBLISHER: ${LEGAL_PUBLISHER:-}
      LEGAL_CONTACT: ${LEGAL_CONTACT:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      LEGAL_STATUS: ${LEGAL_STATUS:-}
      LEGAL_REGISTRATION: ${LEGAL_REGISTRATION:-}
      LEGAL_VAT: ${LEGAL_VAT:-}
      LEGAL_CAPITAL: ${LEGAL_CAPITAL:-}
      LEGAL_DIRECTOR: ${LEGAL_DIRECTOR:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-}
      SESSION_SECRET: ${SESSION_SECRET:?Configure SESSION_SECRET}
      CELCAT_XML_URL: ${CELCAT_XML_URL:-https://celcat-auth.univ-reims.fr/997/groupes/t1739184.xml}
    ports:
      - "3000:3000"
